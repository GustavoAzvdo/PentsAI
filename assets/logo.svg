<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a0007" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#080205" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020002" stop-opacity="1"/>
    </radialGradient>

    <!-- Neon Crimson Gradient -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40"/>
      <stop offset="50%" stop-color="#ff0033"/>
      <stop offset="100%" stop-color="#99001a"/>
    </linearGradient>

    <!-- Cyber Cyan / Matrix Accent -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#008877"/>
    </linearGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="metalShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a35"/>
      <stop offset="50%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#0c0c12"/>
    </linearGradient>

    <!-- Filters for Neon Glow -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background Canvas -->
  <rect width="500" height="500" rx="30" fill="url(#bgGlow)"/>

  <!-- Cyber Grid Lines (Radar / Target) -->
  <g opacity="0.15" stroke="#ff0033" stroke-width="1">
    <circle cx="250" cy="235" r="190" fill="none" stroke-dasharray="6,8"/>
    <circle cx="250" cy="235" r="140" fill="none" stroke-dasharray="4,6"/>
    <circle cx="250" cy="235" r="80" fill="none"/>
    <line x1="250" y1="25" x2="250" y2="445"/>
    <line x1="40" y1="235" x2="460" y2="235"/>
  </g>

  <!-- Outer Tactical Hexagonal Shield -->
  <polygon points="250,55 410,130 410,320 250,425 90,320 90,130" 
           fill="url(#metalShield)" stroke="url(#redGlow)" stroke-width="4" filter="url(#neonBlur)"/>

  <!-- Inner Tech Border -->
  <polygon points="250,75 390,140 390,305 250,400 110,305 110,140" 
           fill="#07070a" stroke="#ff1a40" stroke-width="1.5" stroke-dasharray="16,8" opacity="0.8"/>

  <!-- Hacker Hood Silhouette -->
  <path d="M 250,90 
           C 210,90 155,130 145,200 
           C 138,245 150,295 175,340 
           L 205,335 
           L 215,310 
           C 215,310 235,325 250,325 
           C 265,325 285,310 285,310 
           L 295,335 
           L 325,340 
           C 350,295 362,245 355,200 
           C 345,130 290,90 250,90 Z" 
        fill="#121218" stroke="#ff0033" stroke-width="3"/>

  <!-- Facemask / Cybernetic Skull Lower Jaw -->
  <path d="M 210,240 
           L 250,265 
           L 290,240 
           L 300,285 
           L 275,320 
           L 250,335 
           L 225,320 
           L 200,285 Z" 
        fill="#181822" stroke="#2a2a38" stroke-width="2"/>

  <!-- Tactical Faceplates / Vents -->
  <line x1="235" y1="280" x2="245" y2="305" stroke="#ff0033" stroke-width="2" opacity="0.8"/>
  <line x1="250" y1="282" x2="250" y2="310" stroke="#ff0033" stroke-width="2" opacity="0.8"/>
  <line x1="265" y1="280" x2="255" y2="305" stroke="#ff0033" stroke-width="2" opacity="0.8"/>

  <!-- Cyber Visor / Optical Scanner (Glowing Red Eyes) -->
  <polygon points="190,205 240,215 250,225 260,215 310,205 295,225 250,245 205,225" 
           fill="url(#redGlow)" filter="url(#heavyGlow)"/>

  <!-- Visor Digital Scanlines / HUD Accent -->
  <line x1="205" y1="215" x2="295" y2="215" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/>
  <circle cx="250" cy="225" r="4" fill="#ffffff" filter="url(#neonBlur)"/>

  <!-- Target Reticles / Tactical Accents -->
  <g stroke="url(#cyberCyan)" stroke-width="2" fill="none">
    <!-- Top Left Corner Mark -->
    <path d="M 125,150 L 125,135 L 145,135"/>
    <!-- Top Right Corner Mark -->
    <path d="M 375,150 L 375,135 L 355,135"/>
    <!-- Bottom Shield Anchor -->
    <path d="M 240,412 L 250,422 L 260,412"/>
  </g>

  <!-- Side Tech Circuit Accents -->
  <path d="M 115,220 L 135,220 L 145,235" stroke="#ff0033" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="115" cy="220" r="3" fill="#ff0033"/>
  <path d="M 385,220 L 365,220 L 355,235" stroke="#ff0033" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="385" cy="220" r="3" fill="#ff0033"/>

  <!-- Brand Typography: PENTSAI -->
  <text x="250" y="462" 
        font-family="'Orbitron', 'Chakra Petch', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="10" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#neonBlur)">
    PENTS<tspan fill="#ff0033">.AI</tspan>
  </text>

  <!-- Subtitle: OFFENSIVE SECURITY -->
  <text x="250" y="482" 
        font-family="'Courier New', monospace" 
        font-size="9" 
        font-weight="bold" 
        letter-spacing="4" 
        fill="#00ffcc" 
        text-anchor="middle"
        opacity="0.9">
    RED TEAM // PENTEST MENTOR
  </text>
</svg>
